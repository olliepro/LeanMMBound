version: "v0.4"

project:
  name: "LeanMMBound: the matrix multiplication exponent is below 2.3710449"
  description: >-
    A complete Lean 4 / Mathlib proof that the algebraic matrix multiplication exponent ω over every
    commutative ring is below 2.3710449, improving the previous bound ω < 2.371177 of Dupont et al.
    (2026). The mathematical novelty is a shared extraction step for the asymmetric laser method:
    factors from different recursion levels share one asymmetric hash, and a finite, staggered
    pipeline combines their contributions before the minimum over axes is taken. The formalization
    covers the whole argument: the Coppersmith–Winograd degeneration, tensor powers, hashing with
    Behrend progression-free sets, repair of damaged copies, the shared extraction pipeline, the
    asymptotic sum inequality for rectangular products, and an exact rational certificate for the
    resulting optimization, checked in the Lean kernel with exact arithmetic. The construction and
    its proof were produced largely by AI systems under the authors' direction (see automation).
  authors:
    - "Oliver Proudfoot"
    - "Andrew Perrault"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Oliver Proudfoot"
    - "Andrew Perrault"

