related_formalizations:
  - id: "https://arxiv.org/abs/2608.28433"
    relationship: independent
    note: >-
      Prove2Me hosts a community campaign formalizing upper bounds on ω in Lean against an
      operation-count definition. This development is independent of it, and relating the two
      definitions is not formalized. We know of no earlier formalization of a laser-method bound.

status:
  scope: >-
    Formalizes exponent K < 23710449/10000000 for every commutative ring K : Type, where exponent K is the
    infimum of the τ ≥ 0 such that matrixRank K n ≤ C·n^τ for one constant C > 0 and all n ≥ 1, and
    matrixRank K n is the exact tensor rank (minimal length of a rank decomposition) of the n×n matrix
    multiplication tensor; the definitions are in Challenge.lean. The development also proves that this
    tensor's bilinear evaluation is Mathlib's matrix product and that 0 ≤ exponent K ≤ 3. Not formalized:
    the conventional equivalence between rank and arithmetic operation counts, which is needed to read the
    result as a bound on the number of operations; rings in universes above Type. Border rank and
    degenerations appear only inside the proof. The numerical parameters came from an unverified
    floating-point search; only the exact rational witness derived from them is checked, entirely in the
    Lean kernel.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["GPT-6 Astra", "Claude Fable 5.1", "Claude Opus 5", "Claude Opus 5.5"]
      framework: "Codex and Claude Code"
      tool_setup: >-
        GPT-6 Astra (Pro) produced the shared-extraction idea, its natural-language proof and the first
        numerical search. Astra in Codex and Claude Fable 5.1 in Claude Code wrote the Lean development and
        certificate generators, running builds on a Slurm cluster. Claude Opus 5 and Opus 5.5 ported the
        development to Lean 4.35 and the Palomar layout and wrote the fast kernel-check layer (src/FKL*).
        Fable drafted the paper, which was edited with Astra and by the authors.
      cost:
        wall_time: "about 60 hours"
        spend_usd: "subscription-based"
        hardware: "Ohio Supercomputer Center CPU nodes and a local Mac"
      prompting_notes: >-
        Simple high-level prompts, for example "make significant analytical progress on [improving the
        bound]" and "Formalize the proof."; the paper's appendix gives the full timeline.
    - method: other
      models: ["Meta Muse Spark 1.3"]
      framework: "n/a"
      tool_setup: >-
        Ran the final constrained numerical optimization to convergence on Ohio Supercomputer Center GPUs.
        The search is a discovery step only; the theorem depends only on the exact rational witness.
      cost:
        wall_time: "included above"
        spend_usd: "subscription-based"
        hardware: "Ohio Supercomputer Center GPU nodes"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    The authors chose the problem, directed the process, audited the formal statement and independently
    reproduced the build. They have not verified every step of the natural-language proof in the paper;
    correctness rests on the formal proof.

fidelity:
  divergences: >-
    The paper's exposition works over a characteristic-zero field; the formal theorem is the exact-rank
    statement over every commutative ring in Type. The paper's proof uses a bounded-differences
    concentration estimate for readability; the formal proof uses a second-moment estimate sufficient for
    subexponential repair. The paper states the rounded bound 2.371045; the formal bound is 2.3710449.
    The paper's formalization appendix describes the Lean 4.24 release (commit 884a354); this Lean 4.35
    release checks the same rate identities with generic fast kernel checkers (docs/fast-kernel-checks.md)
    in place of node-by-node certificate windows.

review:
  status: "self-assessed"
  reviewers:
    - "Andrew Perrault"
  notes: >-
    Andrew Perrault, assisted by Claude Fable 5.1, independently audited the statement of the Lean 4.24
    release (20-22 September 2026): the standalone challenge file copies the project's definitions of
    tensor rank, the matrix multiplication tensor and the exponent verbatim, imports only Mathlib, and
    Comparator confirmed that the project's exponent_lt proves exactly it. He also rebuilt that release
    from scratch, replayed it with lean4checker and a second kernel, and reran the independent Python
    interval verifier on the certificate. The submitted Challenge.lean is his file ported to Lean 4.35:
    the module header, public imports, four backward.* options (including backward.proofsInPublic, so
    that proof helpers get the same names in every module) and a porting note were added, and every
    declaration is unchanged. The port and the fast kernel-check layer postdate his audit; they are
    checked by Comparator and by three kernels (Lean, NanoDa, con-ron) but have not had a separate human
    review.

alignment:
  namespace: "MatrixBounds"
  statements:
    - source: "Main theorem: ω < 2.3710449"
      lean: "MatrixBounds.Numeric.SuppliedCertifiedPipeline.exponent_lt"
      module: "SuppliedCertifiedPipeline"
      status: "proved"
      note: >-
        The paper's main theorem (stated there as ω < 2.371045, rounded). exponent K is the algebraic
        exact-rank exponent over the commutative ring K.

acknowledgements: "Built on Mathlib. Kernel checking by Lean, NanoDa and con-ron via Palomar's Comparator."
